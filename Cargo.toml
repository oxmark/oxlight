[package]
name = "oxlight"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Syntax highlighting with TextMate grammars and VS Code themes, a Rust port of Shiki"
license = "Apache-2.0"
readme = "README.md"
keywords = ["highlighting", "syntax", "textmate", "shiki"]
categories = ["text-processing", "parsing"]
exclude = ["/scripts", "/.github", "/tests/fixtures"]

[dependencies]
onig = { version = "6.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
